<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="80%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <radialGradient id="meshGlowCyan" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshGlowPurple" cx="80%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshGlowCenter" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients for UI Cards & Borders -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.28"/>
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.35"/>
    </pattern>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(14px) rotate(-1.5deg); }
      }
      @keyframes floatSlow3 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-10px) translateX(8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.04); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }

      .floating-pill-1 {
        animation: floatSlow1 7s ease-in-out infinite;
      }
      .floating-pill-2 {
        animation: floatSlow2 8.5s ease-in-out infinite;
      }
      .floating-pill-3 {
        animation: floatSlow3 9s ease-in-out infinite;
      }
      .pulsing-mesh {
        transform-origin: center;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .stream-path {
        stroke-dasharray: 6 6;
        animation: dashFlow 2.5s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGradient)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Ambient Pulsing Glow Orbs -->
  <ellipse class="pulsing-mesh" cx="240" cy="140" rx="360" ry="240" fill="url(#meshGlowCyan)"/>
  <ellipse class="pulsing-mesh" cx="960" cy="280" rx="380" ry="260" fill="url(#meshGlowPurple)"/>
  <ellipse class="pulsing-mesh" cx="600" cy="210" rx="420" ry="220" fill="url(#meshGlowCenter)"/>

  <!-- Dynamic Animated Tech Background Connections -->
  <g opacity="0.45">
    <path class="stream-path" d="M 120 80 Q 300 40 500 100 T 900 80 T 1120 120" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path class="stream-path" d="M 80 340 Q 350 380 600 320 T 980 340 T 1150 300" fill="none" stroke="#818cf8" stroke-width="2"/>
  </g>

  <!-- Animated Floating Dynamic Pills (Background Accents - Placed carefully so title is unobscured) -->
  <!-- Top Left Pill -->
  <g class="floating-pill-1" transform="translate(70, 48)">
    <rect width="210" height="38" rx="19" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#softShadow)"/>
    <circle cx="22" cy="19" r="6" fill="#10b981"/>
    <text x="36" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.3">ITSM Self-Service Portal</text>
  </g>

  <!-- Top Right Pill -->
  <g class="floating-pill-2" transform="translate(930, 48)">
    <rect width="200" height="38" rx="19" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#softShadow)"/>
    <circle cx="22" cy="19" r="6" fill="#38bdf8"/>
    <text x="36" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.3">Zero-Touch Fulfillment</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="floating-pill-3" transform="translate(85, 332)">
    <rect width="190" height="38" rx="19" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#softShadow)"/>
    <circle cx="22" cy="19" r="6" fill="#818cf8"/>
    <text x="36" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.3">Automated SLA Flows</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="floating-pill-1" transform="translate(925, 332)">
    <rect width="205" height="38" rx="19" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#softShadow)"/>
    <circle cx="22" cy="19" r="6" fill="#f43f5e"/>
    <text x="36" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.3">Enterprise ITIL &amp; ESM</text>
  </g>

  <!-- Dynamic Request Flow Card in Background Center-Bottom -->
  <g opacity="0.35" transform="translate(390, 328)">
    <rect width="420" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="210" y="26" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12" letter-spacing="1">
      REQUEST [✓] ➔ APPROVAL ENGINE ➔ ORCHESTRATION ➔ FULFILLED
    </text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Badge, Titles, Subtitles (Guaranteed High Contrast & Never Obscured) -->
  <g filter="url(#softShadow)">
    <!-- Category Pill Badge -->
    <g transform="translate(485, 96)">
      <rect width="230" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="18" cy="16" r="4" fill="#38bdf8"/>
      <text x="115" y="21" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
        ENTERPRISE ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="196" text-anchor="middle" fill="url(#titleGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
      Awesome Service Catalog
    </text>

    <!-- Accent Divider Line -->
    <line x1="360" y1="220" x2="840" y2="220" stroke="url(#accentLine)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Subtitle -->
    <text x="600" y="258" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" letter-spacing="0.2">
      Self-Service Portals, Request Menus &amp; Automated Fulfillment Architectures
    </text>

    <!-- Secondary Meta / Tagline -->
    <text x="600" y="294" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" letter-spacing="0.6">
      SaaS Industry Giants • Sovereign Open-Source Stacks • ITIL / ESM • Dynamic Workflows
    </text>
  </g>
</svg>
